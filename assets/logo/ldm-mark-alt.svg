<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>LDM</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233a"/>
      <stop offset="1" stop-color="#070b13"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cf59c"/>
      <stop offset="1" stop-color="#15c364"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="240" rx="116" fill="url(#gloss)"/>
  <rect x="24.5" y="24.5" width="463" height="463" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
  <!-- queued segments stacking into the arrow -->
  <path d="M196 124 h120" fill="none" stroke="#8fa3bd" stroke-opacity="0.55" stroke-width="34" stroke-linecap="round"/>
  <path d="M176 188 h160" fill="none" stroke="#8fa3bd" stroke-opacity="0.8" stroke-width="34" stroke-linecap="round"/>
  <path d="M152 252 h208" fill="none" stroke="url(#arrow)" stroke-width="34" stroke-linecap="round"/>
  <!-- arrow head -->
  <path d="M160 304 l96 96 l96 -96 z" fill="url(#arrow)" stroke="url(#arrow)" stroke-width="30" stroke-linejoin="round"/>
</svg>
